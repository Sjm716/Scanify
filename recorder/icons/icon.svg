<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52525b"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <g id="hub">
      <circle r="17" fill="#f4f4f5" stroke="#18181b" stroke-width="3"/>
      <g fill="#18181b">
        <rect x="-3" y="-10" width="6" height="7"/>
        <rect x="-3" y="-10" width="6" height="7" transform="rotate(60)"/>
        <rect x="-3" y="-10" width="6" height="7" transform="rotate(120)"/>
        <rect x="-3" y="-10" width="6" height="7" transform="rotate(180)"/>
        <rect x="-3" y="-10" width="6" height="7" transform="rotate(240)"/>
        <rect x="-3" y="-10" width="6" height="7" transform="rotate(300)"/>
      </g>
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- carry handle -->
  <path d="M150 140 V108 a26 26 0 0 1 26 -26 H336 a26 26 0 0 1 26 26 V140" fill="none" stroke="#18181b" stroke-width="22" stroke-linejoin="round"/>

  <!-- piano keys -->
  <g stroke="#18181b" stroke-width="6">
    <rect x="124" y="122" width="44" height="38" rx="6" fill="#dc2626"/>
    <rect x="178" y="128" width="44" height="32" rx="6" fill="url(#key)"/>
    <rect x="232" y="128" width="44" height="32" rx="6" fill="url(#key)"/>
    <rect x="286" y="128" width="44" height="32" rx="6" fill="url(#key)"/>
    <rect x="340" y="128" width="44" height="32" rx="6" fill="url(#key)"/>
  </g>

  <!-- body -->
  <rect x="64" y="152" width="384" height="276" rx="34" fill="url(#body)" stroke="#18181b" stroke-width="10"/>

  <!-- cassette door -->
  <rect x="100" y="182" width="312" height="146" rx="16" fill="#27272a"/>
  <!-- cassette label and window -->
  <rect x="122" y="198" width="268" height="114" rx="10" fill="#fbbf24"/>
  <rect x="122" y="198" width="268" height="20" rx="10" fill="#0ea5e9"/>
  <rect x="122" y="208" width="268" height="10" fill="#0ea5e9"/>
  <rect x="158" y="226" width="196" height="68" rx="34" fill="#18181b"/>
  <!-- wound tape: fuller on the left -->
  <circle cx="194" cy="260" r="31" fill="#78350f"/>
  <circle cx="318" cy="260" r="23" fill="#78350f"/>
  <use href="#hub" x="194" y="260"/>
  <use href="#hub" x="318" y="260"/>

  <!-- speaker grille -->
  <g stroke="#3f3f46" stroke-width="9" stroke-linecap="round">
    <path d="M104 356 H330"/>
    <path d="M104 380 H330"/>
    <path d="M104 404 H330"/>
  </g>
  <!-- REC light -->
  <circle cx="390" cy="380" r="20" fill="#dc2626" stroke="#18181b" stroke-width="6"/>
  <circle cx="384" cy="374" r="6" fill="#fecaca"/>
</svg>
